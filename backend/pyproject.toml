[project]
name = "village-city-api"
version = "0.1.0"
description = "Backend API for the Village City demand-responsive transport system."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11,<1.0",
]

[tool.uv]
package = false
required-version = ">=0.10.2"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
